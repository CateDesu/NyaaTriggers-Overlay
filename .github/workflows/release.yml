name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Share one queue across refs. Reject stale runs because pending runs can reorder.
concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  # Dalamud 15.0.3.5 keeps builds on API 15.
  DALAMUD_DISTRIB: https://raw.githubusercontent.com/goatcorp/dalamud-distrib/46833da369fb1fec8942fe2a108e866b69cf6ce3/latest.zip
  PACKAGE: NyaaTriggers.Plugin/bin/Release/NyaaTriggers/latest.zip
  MANIFEST: NyaaTriggers.Plugin/bin/Release/NyaaTriggers.json

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      rolling: ${{ steps.v.outputs.rolling }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          CS=$(grep -oP '<Version>\K[^<]+' NyaaTriggers.Plugin/NyaaTriggers.Plugin.csproj | head -1)
          if [ -z "$CS" ]; then echo "::error::could not read <Version> from the csproj"; exit 1; fi
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            VER="${TAG#v}"
            # Check the tag before overriding the csproj version.
            if [ "$VER" != "$CS" ]; then
              echo "::error::tag $TAG disagrees with csproj <Version> $CS"; exit 1
            fi
            ROLL=false
          else
            if [ "$REF_NAME" != "main" ]; then
              echo "::error::branch $REF_NAME has no release channel"; exit 1
            fi
            BASE=$(echo "$CS" | grep -oP '^[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$BASE" ]; then echo "::error::csproj <Version> $CS is not x.y.z[.w]"; exit 1; fi
            VER="${BASE}.${RUN_NUMBER}"
            TAG="v${VER}"
            ROLL=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "rolling=$ROLL"
          } >> "$GITHUB_OUTPUT"
          echo "Building tag=$TAG version=$VER rolling=$ROLL"

  build:
    needs: [meta]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.fresh.outputs.publish }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch the Dalamud assemblies
        run: |
          # CI has no XIVLauncher assemblies.
          mkdir -p "$HOME/dalamud"
          curl -fsSL "$DALAMUD_DISTRIB" -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$HOME/dalamud"
          test -f "$HOME/dalamud/Dalamud.dll" || {
            echo "::error::Dalamud.dll missing from the distrib zip"; exit 1; }
          echo "DALAMUD_HOME=$HOME/dalamud" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: dotnet build NyaaTriggers.Plugin/NyaaTriggers.Plugin.csproj -c Release -p:Version="$VERSION"

      - name: Run regression tests
        run: |
          dotnet run --project tests/MeterEngineTests
          dotnet run --project tests/BridgeTests
          env -u DISPLAY -u WAYLAND_DISPLAY dotnet run --project tests/HeadlessDpsTests
          python3 tests/test_release_version.py
          python3 tests/test_release_channel.py
          env -u DISPLAY -u WAYLAND_DISPLAY dotnet run --project tests/OverlayRegressionTests

      - name: Check the package came out
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          test -f "$PACKAGE" || { echo "::error::no $PACKAGE"; exit 1; }
          test -f "$MANIFEST" || { echo "::error::no $MANIFEST"; exit 1; }
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open(os.environ["MANIFEST"]))
          v = m.get("AssemblyVersion")
          if v != os.environ["VER"]:
              sys.exit(f"manifest AssemblyVersion {v} != {os.environ['VER']}")
          print(f"manifest AssemblyVersion OK: {v}")
          PY
          unzip -l "$PACKAGE"

      - name: Refuse a tag that is not on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::tag ${GITHUB_REF_NAME} is not an ancestor of main"; exit 1; }

      - name: Refuse stale publication
        id: fresh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          git fetch origin main
          git show origin/main:pluginmaster.json > /tmp/current-pluginmaster.json
          python3 tools/check_publish_version.py /tmp/current-pluginmaster.json "$VERSION" >> "$GITHUB_OUTPUT"

      # Publish the package before its listing URL.
      - name: Publish the release
        if: steps.fresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: python3 tools/release_channel.py publish

      - name: Republish pluginmaster.json
        if: steps.fresh.outputs.publish == 'true'
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          git checkout main
          git pull --rebase origin main
          python3 tools/make_pluginmaster.py \
            --manifest "$MANIFEST" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --out pluginmaster.json

          if git diff --quiet -- pluginmaster.json; then
            echo "pluginmaster.json already current"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "Publish ${TAG} to the plugin repository [skip ci]"
          git pull --rebase origin main
          git push origin main

  # Keep newer releases, drafts and prereleases.
  prune-rolling:
    needs: [meta, build]
    if: needs.meta.outputs.rolling == 'true' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_channel.py prune
