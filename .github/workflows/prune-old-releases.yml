name: Prune old releases

# Manual cleanup preserves the published version and any pending newer release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}
        run: python3 tools/release_channel.py prune
